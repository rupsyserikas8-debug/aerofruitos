name: Build Aerofruitos ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly Sunday build

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    name: Build ISO (Arch Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Arch Linux container
        uses: docker://archlinux:base-devel
        with:
          args: |
            pacman -Sy --noconfirm archiso git python python-textual \
              xmlto kmod bc libelf cpio perl tar xz \
              gtk3 gtk4 gtk-engine-murrine sassc meson \
              imagemagick inkscape xcursorgen fontconfig unzip \
              qemu-system-x86 ovmf dosfstools gptfdisk parted \
              cryptsetup lvm2 btrfs-progs f2fs-tools \
              reflector
      
      - name: Build ISO in Arch container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/build" \
            -w /build/aerofruitos \
            archlinux:base-devel \
            /bin/bash -c "
              set -euo pipefail
              pacman -Sy --noconfirm archiso git python python-textual \
                xmlto kmod bc libelf cpio perl tar xz \
                gtk3 gtk4 gtk-engine-murrine sassc meson \
                imagemagick inkscape xcursorgen fontconfig unzip \
                qemu-system-x86 ovmf dosfstools gptfdisk parted \
                cryptsetup lvm2 btrfs-progs f2fs-tools \
                reflector
              chmod +x build.sh
              ./build.sh
            "
      
      - name: Find built ISO
        id: iso
        run: |
          ISO_PATH=$(find ${{ github.workspace }}/aerofruitos/build/iso_out -name "*.iso" -type f | head -1)
          if [ -z "$ISO_PATH" ]; then
            echo "ISO not found!"
            exit 1
          fi
          echo "path=$ISO_PATH" >> $GITHUB_OUTPUT
          echo "name=$(basename $ISO_PATH)" >> $GITHUB_OUTPUT
      
      - name: Generate SHA256
        run: |
          sha256sum "${{ steps.iso.outputs.path }}" > "${{ steps.iso.outputs.path }}.sha256"
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerofruitos-iso
          path: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
          retention-days: 30
      
      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}-${{ github.run_attempt }}
          name: Aerofruitos Build #${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test ISO in QEMU
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    if: always()
    
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: aerofruitos-iso
          path: ./iso
      
      - name: Find ISO
        id: iso
        run: |
          ISO_PATH=$(find ./iso -name "*.iso" -type f | head -1)
          echo "path=$ISO_PATH" >> $GITHUB_OUTPUT
      
      - name: Quick smoke test (boot to GRUB)
        run: |
          timeout 60 qemu-system-x86_64 \
            -m 1G \
            -cpu host \
            -drive file="${{ steps.iso.outputs.path }}",media=cdrom,readonly=on \
            -boot d \
            -display none \
            -serial stdio \
            -no-reboot || true
        continue-on-error: true

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, test]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "Build failed! Check GitHub Actions for details."
          # Could add Discord/Slack webhook here