name: Build Aerofruitos ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
      
      - name: Pull Arch Linux base-devel image
        run: docker pull archlinux:base-devel
      
      - name: Build ISO in Arch container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/build" \
            archlinux:base-devel \
            /bin/bash -c "
              set -euo pipefail
              
              # Install base dependencies
              pacman -Sy --noconfirm archiso git python python-textual \
                xmlto kmod bc libelf cpio perl tar xz \
                gtk3 gtk4 sassc meson \
                imagemagick inkscape fontconfig unzip \
                qemu-system-x86 ovmf dosfstools gptfdisk parted \
                cryptsetup lvm2 btrfs-progs f2fs-tools \
                reflector base-devel
              
              # Create builder user for AUR packages
              useradd -m -G wheel builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              
              # Install AUR packages as builder user
              sudo -u builder bash -c '
                cd /tmp
                git clone https://aur.archlinux.org/yay.git
                cd yay
                makepkg -si --noconfirm
                yay -S --noconfirm gtk-engine-murrine xcursorgen
              '
              
              # Build the ISO - repo is mounted at /build
              cd /build
              chmod +x build.sh
              ./build.sh
            "
      
      - name: Find ISO
        id: iso
        run: |
          ISO=$(find aerofruitos/build/iso_out -name "*.iso" | head -1)
          if [ -z "$ISO" ]; then
            echo "ISO not found!"
            exit 1
          fi
          echo "path=$ISO" >> $GITHUB_OUTPUT
          echo "name=$(basename $ISO)" >> $GITHUB_OUTPUT
      
      - name: SHA256
        run: sha256sum "${{ steps.iso.outputs.path }}" > "${{ steps.iso.outputs.path }}.sha256"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerofruitos-iso
          path: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
          retention-days: 30
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: always()
        with:
          tag_name: v${{ github.run_number }}
          name: Aerofruitos ${{ github.run_number }}
          files: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
          generate_release_notes: true